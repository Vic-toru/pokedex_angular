# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Pokédex-Angular CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Utiliser Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le projet Angular
        run: npm run build --if-present

      - name: Installer Cypress
        run: npm install --save-dev cypress

      - name: Lancer le serveur local en arrière-plan
        run: npm install -g http-server && http-server dist/angular_project/browser -p 4200 &

      - name: Attendre que l'application soit disponible
        run: npx wait-on http://127.0.0.1:4200/

      - name: Exécuter les tests Cypress
        run: npx cypress run

      - name: Sauvegarder le dossier de build
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  # Déploiement CI/CD via Netlify
  # deploy:
