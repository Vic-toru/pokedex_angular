  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Récupérer le dépôt
  #       uses: actions/checkout@v4

  #     - name: Télécharger le dossier de build
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: build-dist
  #         path: dist/

  #     - name: Installer Netlify CLI
  #       run: npm install -g netlify-cli

  #     - name: Déployer sur Netlify (sans rebuild)
  #       env:
  #         NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  #         NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  #       run: netlify deploy --prod --dir=dist/angular_project/browser --site=$NETLIFY_SITE_ID --no-build

  deploy: 
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le dossier de build
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      # - name: 📤 Déployer via FTP
      #   uses: sebastianpopp/ftp-action@releases/v2
      #   with:
      #     host: ${{ secrets.FTP_HOST }}
      #     user: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     localDir: ./dist
      #     remoteDir: /public_html/victor

      - name: Déployer en FTP
        uses: sebastianpopp/ftp-action@releases/v2
        with:
          host: ${{ secrets.FTP_HOST_P }}
          user: ${{ secrets.FTP_USERNAME_P }}
          password: ${{ secrets.FTP_PASSWORD_P }}
          localDir: ./dist/angular_project/browser
          remoteDir: /