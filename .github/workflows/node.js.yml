# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    - run: npm run build --if-present

    - name: Install http-server globally
      run: npm install -g http-server

    - name: Serve the app in background
      run: http-server dist/angular_project/browser -p 4200 &

    - name: Wait for app to be available
      run: npx wait-on http://127.0.0.1:4200/

    - name: Run Cypress tests
      run: npx cypress run

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Builder
        run: npm run build --if-present
  
      - name: Serve the app in background
        run: http-server dist/angular_project/browser -p 4200 &
  
      - name: Wait for app to be available
        run: npx wait-on http://127.0.0.1:4200/
  
      - name: Run Cypress tests
        run: npx cypress run

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --dir=dist --site=$NETLIFY_SITE_ID
